[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-traffic-system-pakistan"
version = "1.0.0"
description = "AI-powered traffic safety analysis system for Pakistan"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "shap>=0.42.0",
    "xgboost>=1.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.25.0",
    "plotly>=5.15.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.13.0", "osmnx>=1.6.0", "folium>=0.14.0", "shapely>=2.0.0"]
causal = ["dowhy>=0.11.0", "pgmpy>=0.1.23"]
dev = ["pytest>=7.4.0", "black>=23.0.0", "isort>=5.12.0", "flake8>=6.0.0"]

[project.scripts]
traffic-pipeline = "scripts.run_pipeline:main"
traffic-download = "scripts.download_all_data:main"
